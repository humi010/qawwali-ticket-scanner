<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qawaali Night 2026 Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --maroon: #4a1020;
      --maroon-deep: #240912;
      --gold: #d8b36a;
      --gold-soft: #f3dfad;
      --cream: #fff8e9;
      --panel: rgba(58, 16, 31, 0.94);
      --text: #fffaf1;
      --muted: #e8d7c1;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 40px;
      font-family: Arial, sans-serif;
      color: var(--text);
      text-align: center;
      background:
        radial-gradient(circle at top, rgba(216, 179, 106, 0.14), transparent 34%),
        linear-gradient(160deg, #2a0913 0%, #4a1020 52%, #1d0810 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.15;
      background-image:
        linear-gradient(45deg, transparent 46%, var(--gold) 47%, var(--gold) 48%, transparent 49%),
        linear-gradient(-45deg, transparent 46%, var(--gold) 47%, var(--gold) 48%, transparent 49%);
      background-size: 46px 46px;
    }

    .page-shell {
      max-width: 560px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .ornament {
      width: 160px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 18px;
      position: relative;
    }

    .ornament::after {
      content: "✦";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: var(--gold-soft);
      background: #32101b;
      padding: 0 10px;
      font-size: 14px;
    }

    .eyebrow {
      color: var(--gold-soft);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(34px, 8vw, 50px);
      line-height: 1.05;
      color: var(--cream);
      text-shadow: 0 2px 18px rgba(0,0,0,0.35);
    }

    .subtitle {
      margin: 10px 0 24px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(216, 179, 106, 0.55);
      padding: 22px;
      border-radius: 24px;
      box-shadow:
        0 20px 50px rgba(0,0,0,0.35),
        inset 0 0 0 1px rgba(255,255,255,0.03);
      backdrop-filter: blur(8px);
      position: relative;
      overflow: hidden;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      border: 1px solid rgba(216, 179, 106, 0.22);
      border-radius: 50%;
    }

    .card::before {
      top: -48px;
      left: -38px;
    }

    .card::after {
      right: -38px;
      bottom: -48px;
    }

    .scanner-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      margin-bottom: 16px;
      border-radius: 999px;
      background: rgba(216, 179, 106, 0.10);
      border: 1px solid rgba(216, 179, 106, 0.35);
      color: var(--gold-soft);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .reader-wrap {
      padding: 12px;
      border-radius: 20px;
      border: 1px solid rgba(216, 179, 106, 0.75);
      background: rgba(255, 248, 233, 0.05);
      box-shadow: inset 0 0 24px rgba(216, 179, 106, 0.05);
    }

    #reader {
      width: 100%;
      margin: auto;
      overflow: hidden;
      border-radius: 14px;
      background: #12070b;
    }

    #reader video {
      border-radius: 14px;
    }

    #reader__scan_region {
      background: #12070b !important;
    }

    #reader__dashboard_section_swaplink,
    #reader__dashboard_section_csr button,
    #reader button,
    #reader select {
      font-family: Arial, sans-serif !important;
    }

    #reader button {
      border: 0 !important;
      border-radius: 10px !important;
      padding: 10px 14px !important;
      background: var(--gold) !important;
      color: #27120a !important;
      font-weight: 700 !important;
      cursor: pointer !important;
    }

    .hint {
      margin: 14px 6px 0;
      color: #d7c7b3;
      font-size: 13px;
      line-height: 1.5;
    }

    #checking {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(216, 179, 106, 0.10);
      border: 1px solid rgba(216, 179, 106, 0.35);
      color: var(--gold-soft);
      font-size: 16px;
      font-weight: bold;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 22px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.55;
      border: 1px solid transparent;
      box-shadow: 0 10px 28px rgba(0,0,0,0.2);
    }

    .valid {
      background: #e7f6ea;
      color: #16552b;
      border-color: #8fc99b !important;
    }

    .used {
      background: #fbe7e9;
      color: #7a1d2c;
      border-color: #d69aa5 !important;
    }

    .invalid {
      background: #fff3d9;
      color: #76520a;
      border-color: #dfc06a !important;
    }

    #scanAgain {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 14px 18px;
      border: 1px solid #e9c77d;
      border-radius: 12px;
      background: linear-gradient(180deg, #e7c47c, #cda657);
      color: #2d150a;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    #scanAgain:active {
      transform: translateY(1px);
    }

    .footer-note {
      margin-top: 16px;
      color: #cbb8a0;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    @media (max-width: 520px) {
      body {
        padding: 18px 12px 28px;
      }

      .card {
        padding: 16px;
        border-radius: 20px;
      }

      .reader-wrap {
        padding: 9px;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <div class="ornament"></div>
    <div class="eyebrow">DesiMehfil Presents</div>
    <h1>Qawaali Night 2026</h1>
    <p class="subtitle">Staff Ticket Scanner</p>

    <div class="card">
      <div class="scanner-label">✦ Entrance Verification ✦</div>

      <div class="reader-wrap">
        <div id="reader"></div>
      </div>

      <p class="hint">Point the camera at the guest's ticket QR code. Each valid ticket can be accepted only once.</p>

      <div id="checking">Checking ticket...</div>
      <div id="result"></div>

      <button id="scanAgain" onclick="restartScanner()">Scan Next Ticket</button>
    </div>

    <div class="footer-note">Qawaali Night 2026 • Staff Access</div>
  </div>

<script>

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbxRQGuDiSuyTUfAUnHxOEH1Z_mF14_DbyZU5PAFG_u-_FOiATxv8Tx9Yiaaxcq5XH7c/exec";

let scanner = null;
let processing = false;

function startScanner() {
  processing = false;

  document.getElementById("result").style.display = "none";
  document.getElementById("checking").style.display = "none";
  document.getElementById("scanAgain").style.display = "none";

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },
    function(decodedText) {
      if (processing) {
        return;
      }

      processing = true;

      scanner.stop()
      .then(function() {
        document.getElementById("reader").innerHTML = "";
        checkTicket(decodedText);
      })
      .catch(function() {
        checkTicket(decodedText);
      });
    },
    function() {
      // Normal QR scanning attempts are ignored.
    }
  )
  .catch(function(error) {
    console.error(error);

    showMessage(
      "used",
      "❌ CAMERA ERROR<br><br>Please allow camera access."
    );
  });
}

function checkTicket(token) {
  token = String(token || "").trim();

  if (!token) {
    showMessage(
      "invalid",
      "⚠️ INVALID TICKET<br><br>No QR information detected."
    );
    return;
  }

  if (!token.startsWith("QN26:")) {
    showMessage(
      "invalid",
      "⚠️ INVALID TICKET<br><br>This is not a Qawaali Night ticket."
    );
    return;
  }

  document.getElementById("checking").style.display = "block";

  const body = new URLSearchParams();
  body.append("token", token);

  fetch(BACKEND_URL, {
    method: "POST",
    body: body
  })
  .then(function(response) {
    if (!response.ok) {
      throw new Error("Server returned " + response.status);
    }

    return response.json();
  })
  .then(function(response) {
    document.getElementById("checking").style.display = "none";

    if (response.status === "VALID") {
      showMessage(
        "valid",
        "✅ VALID TICKET<br><br>ENTRY ALLOWED<br><br>Ticket ID: " +
        escapeHtml(response.ticketId)
      );
    }
    else if (response.status === "USED") {
      showMessage(
        "used",
        "❌ ALREADY SCANNED<br><br>DO NOT ALLOW ENTRY<br><br>Ticket ID: " +
        escapeHtml(response.ticketId)
      );
    }
    else if (response.status === "INVALID") {
      showMessage(
        "invalid",
        "⚠️ INVALID TICKET<br><br>" +
        escapeHtml(response.message || "Ticket not recognised.")
      );
    }
    else {
      showMessage(
        "used",
        "❌ ERROR<br><br>" +
        escapeHtml(response.message || "Ticket check failed.")
      );
    }
  })
  .catch(function(error) {
    console.error(error);
    document.getElementById("checking").style.display = "none";

    showMessage(
      "used",
      "❌ CONNECTION ERROR<br><br>Could not check the ticket.<br><br>Check the internet connection and try again."
    );
  });
}

function showMessage(type, message) {
  const result = document.getElementById("result");

  result.className = type;
  result.innerHTML = message;
  result.style.display = "block";

  document.getElementById("scanAgain").style.display = "inline-block";
}

function restartScanner() {
  document.getElementById("reader").innerHTML = "";
  document.getElementById("result").style.display = "none";
  document.getElementById("checking").style.display = "none";
  document.getElementById("scanAgain").style.display = "none";

  startScanner();
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

window.addEventListener("load", startScanner);

</script>
</body>
</html>
