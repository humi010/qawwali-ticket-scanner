name: iPhone portrait fast scan
on:
  push:
    paths:
      - '.github/workflows/ios-portrait-speed-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize portrait QR crop and decode speed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          if 'CROSS_PLATFORM_QR_V3' not in s: raise SystemExit('Expected safe scanner override missing')
          old="var max=960, scale=Math.min(1,max/w);\n        canvas.width=Math.round(w*scale); canvas.height=Math.round(h*scale);\n        ctx.drawImage(video,0,0,canvas.width,canvas.height);"
          new="var portrait=innerHeight>innerWidth; var crop=portrait?Math.min(w,Math.round(h*.68)):Math.min(h,Math.round(w*.78)); var sx=Math.max(0,(w-crop)/2),sy=Math.max(0,(h-crop)/2); var target=portrait?720:840; var scale=Math.min(1,target/crop); canvas.width=Math.round(crop*scale);canvas.height=Math.round(crop*scale);ctx.drawImage(video,sx,sy,crop,crop,0,0,canvas.width,canvas.height);"
          if old not in s: raise SystemExit('Exact scanner block not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          # Faster frame cadence: ~20 fps rather than ~12.5 fps.
          s=s.replace("ts-last<80","ts-last<50",1)
          p.write_text(s)
          PY
      - name: Safety checks and commit
        run: |
          grep -q 'function login' index.html
          grep -q 'function check' index.html
          grep -q 'function manual' index.html
          grep -q 'CROSS_PLATFORM_QR_V3' index.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Optimize QR scanning for iPhone portrait and faster detection'
          git push
